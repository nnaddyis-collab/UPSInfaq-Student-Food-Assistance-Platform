<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#123c2b">
<title>UPSInfaq | Campus Food Assistance</title>
<style>
:root{--green:#174b35;--green2:#246b4b;--mint:#e9f4ed;--cream:#fbfaf5;--gold:#c9a45c;--ink:#203128;--muted:#718078;--line:#e5ebe6;--white:#fff;--red:#b94b4b;--shadow:0 12px 35px #173c2810}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.app{min-height:100vh}
.top{background:linear-gradient(120deg,#123c2b,#246b4b);color:white;padding:18px max(18px,calc((100% - 1180px)/2));display:flex;justify-content:space-between;align-items:center;gap:14px;position:sticky;top:0;z-index:10;box-shadow:0 5px 20px #0e332322}
.brand{display:flex;align-items:center;gap:11px;font-weight:850;letter-spacing:.2px}
.logo{width:42px;height:42px;border-radius:14px;background:#ffffff20;display:grid;place-items:center;font-size:22px;border:1px solid #ffffff40}
.brand small{display:block;font-size:10px;letter-spacing:1.7px;font-weight:600;opacity:.75;margin-top:2px}
.topright{display:flex;gap:9px;align-items:center}
.pill{border:1px solid #ffffff50;background:#ffffff16;color:white;border-radius:99px;padding:8px 12px;font-size:12px}
.wrap{max-width:1180px;margin:auto;padding:24px 18px 70px}
.hero{background:linear-gradient(115deg,#e8f2e9,#f8f4e8);border:1px solid #dfe9df;border-radius:26px;padding:30px;display:grid;grid-template-columns:1.35fr .65fr;gap:20px;align-items:center;margin-bottom:22px}
.eyebrow{color:var(--green2);font-size:11px;font-weight:800;letter-spacing:1.7px;text-transform:uppercase}
.hero h1{font-size:clamp(27px,4vw,43px);line-height:1.1;margin:10px 0;color:#183d2c}
.hero p{color:#63746a;max-width:650px;line-height:1.65}
.heroart{font-size:100px;text-align:center;filter:drop-shadow(0 12px 15px #173c2820)}
.btn{border:0;border-radius:12px;padding:11px 16px;background:var(--green);color:white;font-weight:700;font-size:13px;box-shadow:0 5px 13px #174b3520}
.btn:hover{background:var(--green2)}
.btn.light{background:#edf4ee;color:var(--green);box-shadow:none}
.btn.gold{background:#c9a45c;color:#233329}
.btn.danger{background:#fff0f0;color:#a83d3d;box-shadow:none}
.btn.outline{background:white;color:var(--green);border:1px solid var(--line);box-shadow:none}
.btn.small{padding:8px 11px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.tab{border:1px solid var(--line);background:white;padding:10px 15px;border-radius:99px;font-size:12px;font-weight:750;color:#627269}
.tab.active{background:var(--green);border-color:var(--green);color:white}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:white;border:1px solid var(--line);border-radius:19px;padding:17px;box-shadow:var(--shadow)}
.card h3{margin:0 0 7px;font-size:16px}
.muted{color:var(--muted);font-size:12px;line-height:1.55}
.sectionhead{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:26px 0 13px}
.sectionhead h2{margin:0;font-size:21px;color:#1b422f}
.sectionhead p{margin:4px 0 0}
.stat{font-size:27px;font-weight:850;color:var(--green);margin:7px 0}
.statlabel{font-size:11px;color:var(--muted);font-weight:700}
.foodimg{width:100%;height:145px;object-fit:cover;border-radius:13px;background:#edf2ed}
.foodcard{overflow:hidden;padding:11px}
.foodcard h3{margin:10px 2px 3px}
.foodcard .muted{margin:0 2px 8px}
.foodfoot{display:flex;justify-content:space-between;align-items:center;gap:7px;margin:8px 2px 2px}
.stock{font-size:11px;font-weight:800;color:var(--green2)}
.stock.out{color:var(--red)}
.price{font-weight:850;color:var(--green)}
.field{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.field label{font-size:12px;font-weight:750;color:#52645a}
.field input,.field select,.field textarea{border:1px solid #dce5de;border-radius:11px;padding:11px 12px;background:#fff;color:var(--ink);outline:none;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#6c9b7e;box-shadow:0 0 0 3px #dceee1}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>*{flex:1}
.notice{background:#f3f7f2;border:1px solid #e0e9df;border-radius:13px;padding:12px;color:#53685b;font-size:12px;line-height:1.55}
.warning{background:#fff7e8;border-color:#f1dfb9;color:#795c25}
.badge{display:inline-flex;align-items:center;border-radius:99px;padding:5px 9px;font-size:10px;font-weight:800;background:#eaf4ed;color:#286044}
.badge.red{background:#fff0ef;color:#a54242}
.badge.gold{background:#f8f0dd;color:#86672d}
.tablewrap{overflow:auto}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{text-align:left;padding:11px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:#66766d;font-size:10px;text-transform:uppercase;letter-spacing:.7px}
.empty{text-align:center;padding:30px;color:var(--muted);font-size:13px}
.modalback{position:fixed;inset:0;background:#10291dcc;z-index:30;display:grid;place-items:center;padding:16px}
.modal{width:min(520px,100%);max-height:90vh;overflow:auto;background:white;border-radius:22px;padding:23px;box-shadow:0 20px 70px #0003}
.modal h2{margin:0 0 7px}
.close{float:right;border:0;background:#eff3ef;border-radius:50%;width:32px;height:32px;font-size:18px}
.qrbox{border:1px dashed #9ab5a0;border-radius:16px;padding:18px;text-align:center;background:#f7faf7}
.qrbox img{width:170px;height:170px;max-width:100%;background:white;padding:8px;border-radius:12px}
.receipt{border:1px solid #e4e9e4;border-radius:16px;padding:20px;background:linear-gradient(160deg,#fff,#f7faf6)}
.receipt .rhead{text-align:center;border-bottom:1px dashed #bdc9bf;padding-bottom:15px;margin-bottom:12px}
.receipt h2{color:var(--green);letter-spacing:1px}
.receiptrow{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:12px}
.receiptrow.total{font-weight:900;font-size:16px;border-top:1px solid #dce5de;margin-top:7px;padding-top:13px}
.progress{height:9px;background:#edf1ed;border-radius:99px;overflow:hidden}
.progress span{display:block;height:100%;background:linear-gradient(90deg,#317650,#9abd7b);border-radius:99px}
.maplink{color:var(--green2);font-weight:750;text-decoration:none;font-size:12px}
.footer{text-align:center;color:#87948c;font-size:11px;padding:24px 0}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:60;background:#173f2c;color:white;border-radius:99px;padding:12px 18px;font-size:12px;box-shadow:0 8px 30px #0003;max-width:90%;text-align:center}
.loginbox{max-width:460px;margin:45px auto}
.loginbox .card{padding:25px}
.rolegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.roleopt{border:1px solid var(--line);background:white;border-radius:12px;padding:13px;text-align:left;color:var(--ink);font-weight:750}
.roleopt.selected{border:2px solid var(--green);background:#eff7f0}
.roleopt small{display:block;color:var(--muted);font-weight:500;margin-top:4px}
.mobilemenu{display:none}
@media(max-width:800px){
.grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.four{grid-template-columns:repeat(2,minmax(0,1fr))}
.hero{grid-template-columns:1fr;padding:23px}
.heroart{display:none}
.top{padding:13px 15px}
.topright .pill{display:none}
}
@media(max-width:520px){
.wrap{padding:16px 12px 55px}
.grid,.grid.two{grid-template-columns:1fr 1fr;gap:10px}
.card{padding:13px}
.foodimg{height:112px}
.foodcard{padding:8px}
.foodcard h3{font-size:13px}
.foodfoot{align-items:flex-start;flex-direction:column}
.hero h1{font-size:29px}
.sectionhead h2{font-size:18px}
.tab{padding:9px 12px}
.grid.four{grid-template-columns:1fr 1fr}
.topright .btn{padding:8px 10px}
.brand{font-size:14px}
.brand small{font-size:8px}
}
@media print{
body *{visibility:hidden!important}
#printArea,#printArea *{visibility:visible!important}
#printArea{position:absolute;left:0;top:0;width:100%;padding:20px}
.no-print{display:none!important}
}
</style>
</head>
<body>
<div class="app">
<header class="top">
<div class="brand"><div class="logo">♡</div><div>UPSInfaq<small>SHARE FOOD · SHARE HOPE</small></div></div>
<div class="topright">
<span class="pill" id="userPill">Guest access</span>
<button class="btn gold small" id="headerAction" onclick="showAuth()">Sign in</button>
</div>
</header>
<main class="wrap" id="root"></main>
<div class="footer">UPSInfaq · Campus Food Assistance Platform · Demo prototype</div>
</div>
<div id="modalHost"></div>
<div id="toastHost"></div>

<script>
const $=id=>document.getElementById(id);
const money=n=>'RM '+Number(n||0).toFixed(2);
const now=()=>new Date().toISOString();
const fmt=d=>new Date(d).toLocaleString('en-MY',{dateStyle:'medium',timeStyle:'short'});
const uid=prefix=>prefix+'-'+Date.now().toString(36).toUpperCase()+'-'+Math.random().toString(36).slice(2,6).toUpperCase();
const imageFor=(keywords,lock)=>`https://loremflickr.com/700/500/${encodeURIComponent(keywords)}?lock=${lock}`;

const dry=[
['Rice 5kg',18.90,'uncooked rice grains rice bag'],
['Instant Noodles',1.20,'instant noodles packet ramen'],
['Cream Biscuits',4.50,'cream sandwich biscuits cookies'],
['UHT Milk 1L',6.20,'milk carton bottle'],
['Tea Bags',5.90,'tea bags tea cup'],
['Milo 400g',12.90,'malt chocolate drink powder tin'],
['Bihun 400g',3.20,'rice vermicelli dry noodles'],
['Cooking Oil 1kg',7.50,'cooking oil bottle'],
['Sugar 1kg',3.40,'white sugar bag'],
['Wheat Flour 1kg',3.20,'wheat flour bag'],
['Canned Sardines',6.90,'sardines tin canned fish'],
['Baked Beans',4.80,'baked beans tin'],
['Breakfast Cereal',9.90,'breakfast cereal corn flakes box'],
['Rolled Oats',7.90,'rolled oats bowl packet'],
['Crackers',4.20,'plain crackers biscuits'],
['White Bread',3.50,'white sandwich bread loaf'],
['Peanut Butter',8.90,'peanut butter jar'],
['Fruit Jam',6.50,'strawberry jam jar'],
['Canned Tuna',7.20,'canned tuna tin'],
['Coffee 200g',10.90,'instant coffee jar']
].map((x,i)=>({
id:'D'+i,name:x[0],price:x[1],
stock:[18,45,22,14,16,12,20,11,24,19,9,13,8,15,17,10,7,9,12,11][i],
img:imageFor(x[2],i+101),category:'Dry Goods'
}));

const meals=[
['Nasi Lemak',5.00,'nasi lemak banana leaf sambal egg peanuts',18],
['Nasi Ayam',7.00,'Malaysian chicken rice roasted chicken rice cucumber',15],
['Nasi Goreng Kampung',6.00,'nasi goreng kampung fried rice anchovies vegetables',12],
['Mee Goreng',5.50,'Malaysian mee goreng fried yellow noodles',10],
['Nasi Kandar',8.00,'nasi kandar Malaysian rice curry chicken',9],
['Nasi Kerabu',7.00,'nasi kerabu blue rice herbs salted egg',8],
['Bihun Goreng',5.00,'Malaysian fried bihun rice vermicelli noodles',11],
['Kuey Teow Goreng',6.00,'char kuey teow flat rice noodles',10],
['Roti Canai Set',3.50,'roti canai Malaysian flatbread dhal curry',20],
['Chicken Sandwich',4.50,'chicken sandwich sliced bread lettuce',14]
].map((x,i)=>({
id:'M'+i,name:x[0],price:x[1],img:imageFor(x[2],i+201),
stock:x[3],category:'Ready Meals'
}));

const defaultState=()=>({
users:[],current:null,dry,meals,donations:[],vouchers:[],
campaigns:[{
id:'CAMP-001',name:'Breakfast for Better Days',
desc:'Help provide nutritious breakfast packs for students.',
target:1000,raised:420,goalPacks:100,packs:42,
date:'2026-11-15',location:'UPSI Campus',status:'Active',
img:'https://images.unsplash.com/photo-1498837167922-ddd27525d352?auto=format&fit=crop&w=700&q=80'
}],
volunteers:[],feedback:[],notifications:[],redemptions:[],adminLogs:[],
stalls:[
{id:'ST-01',name:'Kafe Harmoni',location:'UPSI Campus',hours:'8:00 AM – 6:00 PM',address:'Sultan Idris Education University, Tanjong Malim',active:true},
{id:'ST-02',name:'Dapur Siswa',location:'Tanjong Malim',hours:'9:00 AM – 5:00 PM',address:'Tanjong Malim, Perak',active:true}
],
settings:{service:2,claimLimit:1}
});

let state;
try{
state=JSON.parse(localStorage.getItem('upsinfaq_v3'))||defaultState();
}catch(e){state=defaultState()}

if(!state.dry||state.dry.length!==20)state.dry=dry;
if(!state.meals||state.meals.length!==10)state.meals=meals;
if(!state.campaigns)state.campaigns=defaultState().campaigns;
if(!state.users)state.users=[];
if(!state.donations)state.donations=[];
if(!state.vouchers)state.vouchers=[];
if(!state.stalls)state.stalls=defaultState().stalls;

state.dry=state.dry.map((p,i)=>({
...p,img:dry.find(x=>x.id===p.id)?.img||imageFor(p.name+' grocery product',i+101)
}));
state.meals=state.meals.map((p,i)=>({
...p,img:meals.find(x=>x.id===p.id)?.img||imageFor(p.name+' Malaysian food',i+201)
}));

let page='home',studentTab='all',donorTab='catalogue',
orgTab='campaigns',adminTab='overview',stallTab='vouchers',
selectedRole='Student',cart={},tip=0;
  function save(){
 localStorage.setItem('upsinfaq_v3',JSON.stringify(state));
}
function toast(message){
 $('toastHost').innerHTML=`<div class="toast">${message}</div>`;
 setTimeout(()=>{$('toastHost').innerHTML=''},2600);
}
function currentUser(){return state.current}
function roleName(){return currentUser()?.role||'Guest'}
function isAdmin(){return roleName()==='Admin'}
function escapeHTML(value){
 return String(value??'').replace(/[&<>"']/g,c=>({
 '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
 }[c]));
}
function showAuth(){
 $('modalHost').innerHTML=`
 <div class="modalback" onclick="if(event.target===this)closeModal()">
 <div class="modal">
 <button class="close" onclick="closeModal()">×</button>
 <div class="eyebrow">Welcome to UPSInfaq</div>
 <h2>Sign in / Create account</h2>
 <p class="muted">Choose your account role to access the demo platform.</p>
 <div class="field"><label>Full name</label><input id="authName" placeholder="Enter your name"></div>
 <div class="field"><label>Email address</label><input id="authEmail" type="email" placeholder="name@siswa.com"></div>
 <div class="field"><label>Role</label>
 <select id="authRole" onchange="toggleRoleFields()">
 ${['Student','Donor','Organiser','Registered Stall','Admin'].map(r=>`<option>${r}</option>`).join('')}
 </select></div>
 <div id="roleFields"></div>
 <div class="field" id="adminCodeField" style="display:none">
 <label>Demo admin access code</label><input id="authAdminCode" type="password" placeholder="Access code">
 </div>
 <button class="btn" style="width:100%;margin-top:8px" onclick="login()">Continue</button>
 <p class="muted" style="margin-top:12px">Demo only: accounts are stored in this browser. Do not enter real passwords or sensitive information.</p>
 </div></div>`;
 toggleRoleFields();
}
function closeModal(){$('modalHost').innerHTML=''}
function toggleRoleFields(){
 const role=$('authRole')?.value;
 $('adminCodeField').style.display=role==='Admin'?'block':'none';
 $('roleFields').innerHTML=role==='Student'?`
 <div class="field"><label>Faculty</label><select id="authFaculty"><option>FPE</option><option>FSM</option><option>FSK</option></select></div>
 <div class="field"><label>Residential college</label><select id="authCollege"><option>KUO</option><option>KHAR</option><option>KAHS</option><option>KZ</option></select></div>
 <div class="field"><label>Student eligibility status</label><select id="authEligibility"><option>Pending verification</option><option>Eligible</option></select></div>`:
 role==='Registered Stall'?`
 <div class="field"><label>Stall name</label><input id="authStall" placeholder="Your registered stall name"></div>`:
 role==='Organiser'?`
 <div class="field"><label>Organisation / Club</label><input id="authOrg" placeholder="Club or organisation name"></div>`:'';
}
function login(){
 const name=$('authName').value.trim();
 const email=$('authEmail').value.trim().toLowerCase();
 const role=$('authRole').value;
 if(!name||!email||!email.includes('@'))return toast('Please enter your name and a valid email.');
 if(role==='Student'&&!email.endsWith('@siswa.com'))return toast('Students must use an @siswa.com email address.');
 if(role==='Admin'&&$('authAdminCode').value!=='112233')return toast('Incorrect demo admin code.');
 let user=state.users.find(u=>u.email===email&&u.role===role);
 if(!user){
 user={
 id:uid('USER'),name,email,role,
 faculty:role==='Student'?$('authFaculty').value:'',
 college:role==='Student'?$('authCollege').value:'',
 eligibility:role==='Student'?$('authEligibility').value:'Not applicable',
 stallName:role==='Registered Stall'?$('authStall').value:'',
 organisation:role==='Organiser'?$('authOrg').value:'',
 approved:role==='Admin'
 };
 state.users.push(user);
 }
 state.current=user;
 save();closeModal();render();
 toast('Welcome to UPSInfaq, '+name+'!');
}
function logout(){
 state.current=null;save();page='home';render();toast('You have signed out.');
}
function setPage(p){page=p;render()}
function nav(){
 const u=currentUser();
 $('userPill').textContent=u?u.name+' · '+u.role:'Guest access';
 $('headerAction').textContent=u?'Sign out':'Sign in';
 $('headerAction').onclick=u?logout:showAuth;
}
function homePage(){
 return `
 <section class="hero">
 <div><div class="eyebrow">A little help can make a big difference</div>
 <h1>Food support.<br>Stronger student community.</h1>
 <p>Connecting students, donors, campus food stalls and volunteers through one caring food assistance platform.</p>
 <div class="row" style="justify-content:flex-start">
 <button class="btn" onclick="showAuth()">Get started</button>
 <button class="btn light" onclick="setPage('about')">Discover UPSInfaq</button>
 </div></div>
 <div class="heroart">🥗</div>
 </section>
 <div class="grid four">
 <div class="card"><div class="stat">${state.dry.reduce((a,x)=>a+x.stock,0)+state.meals.reduce((a,x)=>a+x.stock,0)}</div><div class="statlabel">Food items available</div></div>
 <div class="card"><div class="stat">${state.donations.length}</div><div class="statlabel">Demo donations</div></div>
 <div class="card"><div class="stat">${state.vouchers.length}</div><div class="statlabel">Food vouchers issued</div></div>
 <div class="card"><div class="stat">${state.stalls.filter(s=>s.active).length}</div><div class="statlabel">Registered stalls</div></div>
 </div>
 <div class="sectionhead"><div><h2>Explore UPSInfaq</h2><p class="muted">Choose the service that suits your role.</p></div></div>
 <div class="grid">
 ${[['Student','🎓','Claim food assistance','student'],['Donor','💚','Contribute food and support students','donor'],['Organiser','🤝','Manage campaigns and volunteers','organiser'],['Registered Stall','🏪','Manage food voucher redemption','stall'],['Admin','⚙️','Manage the platform','admin']].map(x=>`
 <div class="card"><div style="font-size:30px">${x[1]}</div><h3>${x[0]}</h3><p class="muted">${x[2]}</p><button class="btn light small" onclick="showAuth()">Continue</button></div>`).join('')}
 </div>
 <div class="sectionhead"><div><h2>How it works</h2><p class="muted">A simple food support journey.</p></div></div>
 <div class="grid">
 <div class="card"><div class="stat">01</div><h3>Register</h3><p class="muted">Students and community members access the platform through their selected role.</p></div>
 <div class="card"><div class="stat">02</div><h3>Choose or donate</h3><p class="muted">Students select available food. Donors contribute food or financial support.</p></div>
 <div class="card"><div class="stat">03</div><h3>Collect</h3><p class="muted">Students present their voucher at a participating food stall.</p></div>
 </div>
 <div class="notice" style="margin-top:18px">Prototype notice: This version uses browser storage for demonstration. Accounts, stock and vouchers are not yet synchronised between different devices.</div>`;
}
function aboutPage(){
 return `<div class="card"><div class="eyebrow">About the platform</div><h2>What is UPSInfaq?</h2><p class="muted">UPSInfaq is a campus food assistance concept designed to connect students facing food insecurity with donors, organisers and participating food stalls.</p><h3>Our objectives</h3><ul class="muted"><li>Improve access to food assistance.</li><li>Encourage transparent community donations.</li><li>Connect students with participating campus food stalls.</li><li>Support a caring and sustainable campus community.</li></ul><button class="btn" onclick="setPage('home')">Back to home</button></div>`;
}
function studentPage(){
 if(!currentUser()||roleName()!=='Student')return accessDenied('Student');
 const tabs=[['all','All food'],['dry','Dry goods'],['meals','Ready-to-eat meals'],['vouchers','My vouchers'],['history','Claim history']];
 return `
 <div class="sectionhead"><div><div class="eyebrow">Student portal</div><h2>Hello, ${escapeHTML(currentUser().name)} 👋</h2><p class="muted">Find food assistance available on campus.</p></div><span class="badge">${escapeHTML(currentUser().eligibility)}</span></div>
 <div class="notice">Your eligibility information is private in this demo. Please contact the programme administrator for verification.</div>
 <div class="tabs">${tabs.map(t=>`<button class="tab ${studentTab===t[0]?'active':''}" onclick="studentTab='${t[0]}';render()">${t[1]}</button>`).join('')}</div>
 ${studentTab==='vouchers'?voucherList():studentTab==='history'?claimHistory():foodCatalogue()}
 `;
}
function foodCatalogue(){
 const list=studentTab==='dry'?state.dry:studentTab==='meals'?state.meals:[...state.dry,...state.meals];
 return `<div class="sectionhead"><div><h2>Available food</h2><p class="muted">Choose an item while stocks last.</p></div></div>
 <div class="grid">${list.map(p=>`
 <div class="card foodcard">
 <img class="foodimg" src="${p.img}" alt="${escapeHTML(p.name)}" loading="lazy" onerror="this.onerror=null;this.src='https://placehold.co/600x400/e9f2e9/174b35?text='+encodeURIComponent('${escapeHTML(p.name)}')">

function claimFood(id){
 const all=[...state.dry,...state.meals];
 const item=all.find(x=>x.id===id);
 if(!item||item.stock<=0)return toast('This item is currently unavailable.');
 const today=new Date().toDateString();
 const todayClaims=state.vouchers.filter(v=>v.studentId===currentUser().id&&new Date(v.createdAt).toDateString()===today).length;
 if(todayClaims>=Number(state.settings.claimLimit||1))return toast('You have reached the daily demo claim limit.');
 if(currentUser().eligibility!=='Eligible')return toast('Your eligibility is pending. Please contact the administrator.');
 const stall=state.stalls.find(s=>s.active);
 if(!stall)return toast('No participating stall is currently available.');
 const voucher={
 id:uid('UPS'),studentId:currentUser().id,studentName:currentUser().name,
 itemId:item.id,itemName:item.name,stallId:stall.id,stallName:stall.name,
 createdAt:now(),expiresAt:new Date(Date.now()+48*60*60*1000).toISOString(),
 status:'Active'
 };
 item.stock--;
 state.vouchers.push(voucher);
 state.notifications.push({id:uid('N'),userId:currentUser().id,message:'Your food voucher is ready: '+item.name,date:now()});
 save();render();showVoucher(voucher.id);
}

}
function adminUsers(){
 return `<div class="card"><h3>Account management</h3>${state.users.length?`<div class="tablewrap"><table><tr><th>Name</th><th>Email</th><th>Role</th><th>Eligibility</th><th>Action</th></tr>${state.users.map(u=>`<tr><td>${escapeHTML(u.name)}</td><td>${escapeHTML(u.email)}</td><td>${escapeHTML(u.role)}</td><td>${escapeHTML(u.eligibility||'—')}</td><td>${u.role==='Student'?`<select onchange="setEligibility('${u.id}',this.value)"><option ${u.eligibility==='Pending verification'?'selected':''}>Pending verification</option><option ${u.eligibility==='Eligible'?'selected':''}>Eligible</option><option ${u.eligibility==='Not eligible'?'selected':''}>Not eligible</option></select>`:'—'}</td></tr>`).join('')}</table></div>`:'<div class="empty">No accounts registered.</div>'}</div>`;
}
function setEligibility(id,value){
 const u=state.users.find(x=>x.id===id);
 if(!u)return;
 u.eligibility=value;
 logActivity('Eligibility updated for '+u.name);
 save();toast('Eligibility updated.');
}
function adminInventory(){
 const all=[...state.dry,...state.meals];
 return `<div class="card"><h3>Inventory control</h3><div class="tablewrap"><table><tr><th>Item</th><th>Category</th><th>Stock</th><th>Update stock</th></tr>${all.map(p=>`<tr><td>${escapeHTML(p.name)}</td><td>${p.category}</td><td>${p.stock}</td><td><input style="width:85px;padding:7px;border:1px solid #ddd;border-radius:7px" type="number" min="0" value="${p.stock}" id="stock-${p.id}"><button class="btn light small" onclick="updateStock('${p.id}')">Save</button></td></tr>`).join('')}</table></div></div>`;
}
function updateStock(id){
 const p=[...state.dry,...state.meals].find(x=>x.id===id);
 const input=$('stock-'+id);
 if(!p||!input)return;
 p.stock=Math.max(0,Number(input.value)||0);
 logActivity('Stock updated: '+p.name+' ('+p.stock+')');
 save();render();toast('Inventory updated.');
}
function adminVouchers(){
 return `<div class="card"><h3>Voucher management</h3>${state.vouchers.length?`<div class="tablewrap"><table><tr><th>Voucher ID</th><th>Student</th><th>Food</th><th>Stall</th><th>Status</th></tr>${state.vouchers.slice().reverse().map(v=>`<tr><td>${v.id}</td><td>${escapeHTML(v.studentName)}</td><td>${escapeHTML(v.itemName)}</td><td>${escapeHTML(v.stallName)}</td><td>${v.status}</td></tr>`).join('')}</table></div>`:'<div class="empty">No vouchers issued.</div>'}</div>`;
}
function adminStalls(){
 return `<div class="card"><h3>Registered stalls</h3>${state.stalls.map(s=>`<div class="receiptrow"><span><b>${escapeHTML(s.name)}</b><br><small class="muted">${escapeHTML(s.address)}</small></span><span class="badge">${s.active?'Active':'Inactive'}</span></div>`).join('')}<div class="notice" style="margin-top:12px">New stall approval and identity verification should be handled through a secure backend in the production system.</div></div>`;
}
function adminFinance(){
 const total=state.donations.reduce((a,d)=>a+d.total,0);
 const fees=state.donations.reduce((a,d)=>a+d.fee,0);
 return `<div class="grid two"><div class="card"><div class="stat">${money(total)}</div><div class="statlabel">Recorded demo donation totals</div></div><div class="card"><div class="stat">${money(fees)}</div><div class="statlabel">Calculated demo service charges</div></div></div><div class="notice warning" style="margin-top:14px">These are demonstration records only. They are not verified bank transactions. Restricted student-aid donations should be accounted for separately from platform operating revenue.</div>`;
}
function adminSettings(){
 return `<div class="card"><h3>Platform settings</h3><div class="field"><label>Daily claim limit per student</label><input id="claimLimit" type="number" min="1" max="10" value="${state.settings.claimLimit}"></div><div class="field"><label>Demo service charge (%)</label><input id="serviceFee" type="number" min="0" max="20" step=".5" value="${state.settings.service}"></div><button class="btn" onclick="saveSettings()">Save settings</button><div class="notice warning" style="margin-top:14px">For production: implement server-side role permissions, encrypted authentication, admin approval, two-factor authentication, failed-login protection, automatic session expiry and audit logs.</div></div>`;
}
function saveSettings(){
 state.settings.claimLimit=Math.max(1,Math.min(10,Number($('claimLimit').value)||1));
 state.settings.service=Math.max(0,Math.min(20,Number($('serviceFee').value)||0));
 logActivity('Platform settings updated');
 save();render();toast('Settings saved.');
}
function logActivity(message){
 state.adminLogs.unshift({id:uid('LOG'),message,date:now(),user:currentUser()?.name||'System'});
 state.adminLogs=state.adminLogs.slice(0,100);
}
function adminLogs(){
 return `<div class="card"><h3>Recent activity</h3>${state.adminLogs.length?state.adminLogs.map(l=>`<div class="receiptrow"><span>${escapeHTML(l.message)}<br><small class="muted">${escapeHTML(l.user)}</small></span><small class="muted">${fmt(l.date)}</small></div>`).join(''):'<div class="empty">No activity recorded yet.</div>'}</div>`;
}
function render(){
 nav();
 let html='';
 if(page==='home')html=homePage();
 else if(page==='about')html=aboutPage();
 else if(page==='student')html=studentPage();
 else if(page==='donor')html=donorPage();
 else if(page==='organiser')html=organiserPage();
 else if(page==='stall')html=stallPage();
 else if(page==='admin')html=adminPage();
 $('root').innerHTML=`
 ${currentUser()?`<div class="tabs">
 <button class="tab ${page==='home'?'active':''}" onclick="setPage('home')">Home</button>
 ${currentUser().role==='Student'?`<button class="tab ${page==='student'?'active':''}" onclick="setPage('student')">Student</button>`:''}
 ${currentUser().role==='Donor'?`<button class="tab ${page==='donor'?'active':''}" onclick="setPage('donor')">Donor</button>`:''}
 ${currentUser().role==='Organiser'?`<button class="tab ${page==='organiser'?'active':''}" onclick="setPage('organiser')">Organiser</button>`:''}
 ${currentUser().role==='Registered Stall'?`<button class="tab ${page==='stall'?'active':''}" onclick="setPage('stall')">Stall</button>`:''}
 ${currentUser().role==='Admin'?`<button class="tab ${page==='admin'?'active':''}" onclick="setPage('admin')">Admin</button>`:''}
 </div>`:''}
 ${html}`;
}
render();
</script>
</body>
</html>
