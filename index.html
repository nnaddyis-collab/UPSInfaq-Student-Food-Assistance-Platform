HTML

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UPSInfaq | Student Food Assistance</title>
<style>
:root{--green:#145b43;--light:#eaf4ee;--gold:#d7ad55;--dark:#18352a;--grey:#68766f}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7f5;color:#20352b}
header{background:var(--green);color:white;padding:17px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px}
header h2{margin:0;font-size:21px}
header small{color:#d8e9df}
main{max-width:1100px;margin:auto;padding:20px}
button{border:0;border-radius:9px;padding:11px 15px;background:var(--green);color:white;font-weight:bold;cursor:pointer}
button.secondary{background:#e5eee8;color:var(--green)}
button.danger{background:#a63d3d}
button.gold{background:var(--gold);color:#26352b}
button:disabled{opacity:.4;cursor:not-allowed}
input,select,textarea{width:100%;padding:12px;border:1px solid #ccd8d0;border-radius:8px;margin:6px 0 13px;font:inherit;background:white}
label{font-size:13px;font-weight:bold;color:#40574a}
.card{background:white;border:1px solid #e1e9e3;border-radius:14px;padding:17px;margin-bottom:15px;box-shadow:0 3px 12px #18352a0a}
.login{max-width:430px;margin:45px auto}
h1,h2,h3{color:var(--dark)}
.muted{color:var(--grey);font-size:13px;line-height:1.5}
.tabs{display:flex;gap:8px;overflow-x:auto;margin:15px 0}
.tabs button{white-space:nowrap}
.tabs button.active{background:var(--gold);color:#26352b}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.food-img{width:100%;height:150px;object-fit:cover;border-radius:10px;background:#edf2ee}
.price{font-size:20px;color:var(--green);font-weight:bold}
.qty{display:flex;align-items:center;gap:12px;margin:10px 0}
.qty button{padding:7px 13px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tag{display:inline-block;padding:5px 9px;border-radius:20px;background:#e7f2e9;color:#17613e;font-size:12px;font-weight:bold}
.tag.orange{background:#fff1d9;color:#94600c}
hr{border:0;border-top:1px solid #e6ece7;margin:15px 0}
.hidden{display:none!important}
.small{font-size:12px}
footer{text-align:center;padding:25px;color:#849087;font-size:12px}
</style>
</head>
<body>
<header>
 <div>
  <h2>🌿 UPSInfaq</h2>
  <small>Student Food Assistance Platform</small>
 </div>
 <div id="headerUser"></div>
</header>

<main>
<section id="loginPage" class="login card">
 <h1>Welcome to UPSInfaq</h1>
 <p class="muted">Sign in to access your account.</p>
 <label>Full Name</label>
 <input id="loginName" placeholder="Enter your name">
 <label>Email Address</label>
 <input id="loginEmail" type="email" placeholder="Enter your email">
 <label>Account Role</label>
 <select id="loginRole">
  <option>Student</option>
  <option>Donor</option>
  <option>Organiser</option>
  <option>Registered Stall</option>
  <option>Admin</option>
 </select>
 <div id="studentFields">
  <label>Faculty</label>
  <select id="faculty">
   <option>FPE</option><option>FSM</option><option>FSK</option>
  </select>
  <label>College</label>
  <select id="college">
   <option>KUO</option><option>KHAR</option><option>KAHS</option><option>KZ</option>
  </select>
 </div>
 <div id="adminField" class="hidden">
  <label>Admin Access Code</label>
  <input id="adminCode" type="password" placeholder="Enter admin code">
  <p class="muted">Demo access code: 112233</p>
 </div>
 <button style="width:100%" onclick="login()">Sign In</button>
 <p class="muted">Demo system. Use a different email for each role.</p>
 <p id="loginMessage" class="muted"></p>
</section>

<section id="appPage" class="hidden">
 <div class="row">
  <div>
   <h2 id="welcomeTitle">Dashboard</h2>
   <p class="muted" id="welcomeText"></p>
  </div>
  <button class="secondary" onclick="logout()">Sign Out</button>
 </div>
 <div id="tabs" class="tabs"></div>
 <div id="content"></div>
</section>
</main>
<footer>UPSInfaq • Food Assistance with Care</footer>

<script>
const $=id=>document.getElementById(id);
const KEY="upsinfaq_v1";

const starter={
 users:[],
 products:[
  {id:1,name:"Rice (1kg)",category:"Dry Goods",price:4,stock:100,image:"",sponsored:false,active:true},
  {id:2,name:"Instant Noodles",category:"Dry Goods",price:1.5,stock:100,image:"",sponsored:false,active:true},
  {id:3,name:"Biscuits",category:"Dry Goods",price:2,stock:80,image:"",sponsored:false,active:true},
  {id:4,name:"Cooking Oil (1L)",category:"Dry Goods",price:6,stock:50,image:"",sponsored:false,active:true},
  {id:5,name:"Canned Sardines",category:"Dry Goods",price:4,stock:50,image:"",sponsored:false,active:true},
  {id:6,name:"Packed Rice Meal",category:"Ready-to-Eat Meals",price:0,stock:30,image:"",sponsored:true,active:true}
 ],
 vendors:[
  {id:1,name:"UPSInfaq Food Corner",address:"UPSI Campus",map:"https://maps.google.com",hours:"9 AM - 5 PM",active:true}
 ],
 sponsorships:[
  {id:1,name:"FPE Food Sponsorship",description:"Food sponsored by FPE",stock:20,openAll:true,active:true},
  {id:2,name:"Derma Jumaat",description:"Friday food donation programme",stock:20,openAll:true,active:true}
 ],
 claims:[],
 donations:[],
 cart:{},
 current:null
};

let db;
try{
 db=JSON.parse(localStorage.getItem(KEY))||structuredClone(starter);
}catch(e){db=starter;}
if(!db.products)db.products=starter.products;
if(!db.vendors)db.vendors=starter.vendors;
if(!db.sponsorships)db.sponsorships=starter.sponsorships;
if(!db.claims)db.claims=[];
if(!db.donations)db.donations=[];
if(!db.users)db.users=[];
if(!db.cart)db.cart={};

function save(){localStorage.setItem(KEY,JSON.stringify(db));}
function money(n){return "RM"+Number(n).toFixed(2);}
function uid(){return Date.now()+Math.floor(Math.random()*1000);}
function safe(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

$("loginRole").addEventListener("change",()=>{
 $("studentFields").classList.toggle("hidden",$("loginRole").value!=="Student");
 $("adminField").classList.toggle("hidden",$("loginRole").value!=="Admin");
});
function login(){
 const name=$("loginName").value.trim();
 const email=$("loginEmail").value.trim().toLowerCase();
 const role=$("loginRole").value;
 if(!name||!email||!email.includes("@")){
  $("loginMessage").textContent="Please enter your name and a valid email.";
  return;
 }
 if(role==="Student"&&!email.endsWith("@siswa.com")){
  $("loginMessage").textContent="Students must use an @siswa.com email.";
  return;
 }
 if(role==="Admin"&&$("adminCode").value.trim()!=="112233"){
  $("loginMessage").textContent="Incorrect admin access code.";
  return;
 }
 let user=db.users.find(u=>u.email===email&&u.role===role);
 if(!user){
  user={
   id:uid(),name,email,role,
   faculty:role==="Student"?$("faculty").value:"",
   college:role==="Student"?$("college").value:"",
   eligibility:"Pending",
   approved:role==="Admin",
   cart:{}
  };
  if(role==="Admin"){user.eligibility="Eligible";}
  db.users.push(user);
 }
 db.current=user.id;
 save();
 openApp();
}
function current(){return db.users.find(u=>u.id===db.current);}
function logout(){
 db.current=null;save();
 $("appPage").classList.add("hidden");
 $("loginPage").classList.remove("hidden");
 $("headerUser").innerHTML="";
}
function openApp(){
 const u=current();
 if(!u)return;
 $("loginPage").classList.add("hidden");
 $("appPage").classList.remove("hidden");
 $("headerUser").textContent=u.name+" · "+u.role;
 $("welcomeTitle").textContent="Welcome, "+u.name;
 $("welcomeText").textContent=u.role+" Dashboard";
 render();
}
function tabButtons(items,active){
 $("tabs").innerHTML=items.map(t=>`<button class="${t===active?'active':''}" onclick="go('${t}')">${t}</button>`).join("");
}
let page="";

function go(p){page=p;render();}
function render(){
 const u=current();if(!u)return;
 const menus={
  Student:["Food Assistance","Sponsored Food","My Claims","Food Finder"],
  Donor:["Food Catalogue","My Cart","Donation History"],
  Admin:["Overview","Eligibility","Food Management","Sponsorships","Vendor Management","User List"],
  Organiser:["Overview"],
  "Registered Stall":["Overview","My Vouchers"]
 };
 if(!menus[u.role])menus[u.role]=["Overview"];
 if(!menus[u.role].includes(page))page=menus[u.role][0];
 tabButtons(menus[u.role],page);
 if(u.role==="Student")studentPage();
 if(u.role==="Donor")donorPage();
 if(u.role==="Admin")adminPage();
 if(u.role==="Organiser")$("content").innerHTML="<div class='card'><h2>Organiser Dashboard</h2><p>Campaign management can be added in the next upgrade.</p></div>";
 if(u.role==="Registered Stall")$("content").innerHTML="<div class='card'><h2>Vendor Dashboard</h2><p>Voucher redemption can be added in the next upgrade.</p></div>";
}

/* STUDENT */
function studentPage(){
 const u=current();
 if(page==="Food Assistance"){
  const status=u.eligibility||"Pending";
  $("content").innerHTML=`
   <div class="card">
    <h3>Your Eligibility Status</h3>
    <span class="tag ${status==="Non-Eligible"?'orange':''}">${safe(status)}</span>
    <p class="muted">${status==="Eligible"?"You have priority access to general food assistance.":status==="Non-Eligible"?"You can claim food from available sponsorship programmes.":"Your eligibility is waiting for Admin verification."}</p>
   </div>
   ${status==="Eligible"?foodCards(false):"<div class='card'><h3>General food assistance</h3><p class='muted'>General food assistance is prioritised for eligible students.</p></div>"}`;
 }
 if(page==="Sponsored Food"){
  $("content").innerHTML=`<h3>Sponsored Food Programmes</h3><p class="muted">Available to eligible and non-eligible students, depending on sponsor rules.</p>${sponsorCards()}`;
 }
 if(page==="My Claims"){
  const claims=db.claims.filter(c=>c.email===u.email);
  $("content").innerHTML="<h3>My Claim History</h3>"+(claims.length?claims.map(c=>`<div class="card"><b>${safe(c.item)}</b><p class="muted">${safe(c.date)} · ${safe(c.code)}</p><span class="tag">${safe(c.status)}</span></div>`).join(""):"<p class='muted'>No claims yet.</p>");
 }
 if(page==="Food Finder"){
  $("content").innerHTML=vendorCards();
 }
}
function foodCards(sponsored){
 const items=db.products.filter(p=>p.active&&p.stock>0&&!!p.sponsored===sponsored);
 return `<div class="grid">${items.map(p=>`
 <div class="card">
  ${p.image?`<img class="food-img" src="${p.image}">`:"<div class='food-img'></div>"}
  <h3>${safe(p.name)}</h3><p class="muted">${safe(p.category)}</p>
  <span class="tag">${p.stock} available</span>
  <button style="width:100%;margin-top:12px" onclick="claimFood(${p.id})">Claim Food</button>
 </div>`).join("")||"<p class='muted'>No food currently available.</p>"}</div>`;
}
function sponsorCards(){
 const u=current();
 return db.sponsorships.filter(s=>s.active&&s.stock>0).map(s=>`
 <div class="card">
  <h3>${safe(s.name)}</h3><p class="muted">${safe(s.description)}</p>
  <span class="tag">${s.stock} available</span>
  <p class="small">${s.openAll?"Open to all students":"Eligible students only"}</p>
  <button onclick="claimSponsor(${s.id})">Claim Sponsored Food</button>
 </div>`).join("")||"<p class='muted'>No sponsored food available.</p>";
}
function claimFood(id){
 const u=current(),p=db.products.find(x=>x.id===id);
 if(u.eligibility!=="Eligible")return alert("Only eligible students can claim general food assistance.");
 if(!p||p.stock<1)return alert("Item is out of stock.");
 p.stock--;
 const code="UPS"+Math.random().toString(36).substring(2,8).toUpperCase();
 db.claims.push({email:u.email,item:p.name,code,status:"Active",date:new Date().toLocaleString(),vendor:"Any participating vendor"});
 save();alert("Claim successful! Your demo voucher code: "+code);render();
}
function claimSponsor(id){
 const u=current(),s=db.sponsorships.find(x=>x.id===id);
 if(!s||s.stock<1)return alert("No sponsored food available.");
 if(!s.openAll&&u.eligibility!=="Eligible")return alert("This sponsorship is for eligible students only.");
 s.stock--;
 const code="SP"+Math.random().toString(36).substring(2,8).toUpperCase();
 db.claims.push({email:u.email,item:s.name,code,status:"Active",date:new Date().toLocaleString(),vendor:"Participating vendor"});
 save();alert("Sponsored food claimed! Demo voucher: "+code);render();
}
function vendorCards(){
 return db.vendors.filter(v=>v.active).map(v=>`<div class="card"><h3>${safe(v.name)}</h3><p>${safe(v.address)}</p><p class="muted">${safe(v.hours)}</p><a href="${safe(v.map)}" target="_blank">Open Google Maps ↗</a></div>`).join("")||"No vendors available.";
}

/* DONOR */
function donorPage(){
 if(page==="Food Catalogue"){
  $("content").innerHTML=`<h3>Dry Goods & Meals</h3><div class="grid">${db.products.filter(p=>p.active&&p.price>0).map(p=>`
   <div class="card">
    ${p.image?`<img class="food-img" src="${p.image}">`:"<div class='food-img'></div>"}
    <h3>${safe(p.name)}</h3><p class="muted">${safe(p.category)}</p>
    <div class="price">${money(p.price)}</div>
    <p class="small">${p.stock} in stock</p>
    <div class="qty">
     <button class="secondary" onclick="changeQty(${p.id},-1)">−</button>
     <b>${db.cart[p.id]||0}</b>
     <button onclick="changeQty(${p.id},1)">+</button>
    </div>
    <button style="width:100%" onclick="addCart(${p.id})">Add to Cart</button>
   </div>`).join("")}</div>`;
 }
 if(page==="My Cart")cartPage();
 if(page==="Donation History"){
  const list=db.donations.filter(d=>d.email===current().email);
  $("content").innerHTML="<h3>Donation History</h3>"+(list.map(d=>`<div class="card"><b>${safe(d.date)}</b><p>${money(d.total)}</p><span class="tag">${safe(d.status)}</span></div>`).join("")||"<p class='muted'>No donations yet.</p>");
 }
}
function changeQty(id,n){
 const p=db.products.find(x=>x.id===id);
 const now=db.cart[id]||0;
 db.cart[id]=Math.max(0,Math.min(p.stock,now+n));
 save();render();
}
function addCart(id){
 if(!(db.cart[id]>0))return alert("Please select a quantity first.");
 alert("Item added to your cart.");
 page="My Cart";render();
}
function cartPage(){
 const entries=Object.entries(db.cart).filter(([id,q])=>q>0);
 const total=entries.reduce((sum,[id,q])=>{
  const p=db.products.find(x=>x.id==id);return sum+(p?p.price*q:0);
 },0);
 $("content").innerHTML=`
 <h3>Your Donation Cart</h3>
 ${entries.map(([id,q])=>{
  const p=db.products.find(x=>x.id==id);if(!p)return "";
  return `<div class="card row"><div><b>${safe(p.name)}</b><p class="muted">${q} × ${money(p.price)}</p></div><b>${money(q*p.price)}</b></div>`;
 }).join("")||"<p class='muted'>Your cart is empty. Add items from Food Catalogue.</p>"}
 <div class="card">
  <div class="row"><span>Subtotal</span><b>${money(total)}</b></div>
  <div class="row"><span>Service charge (2%)</span><b>${money(total*.02)}</b></div>
  <hr><div class="row"><h3>Total Donation</h3><h2>${money(total*1.02)}</h2></div>
  <button style="width:100%" ${total<=0?"disabled":""} onclick="checkout()">Confirm Donation</button>
 </div>`;
}
function checkout(){
 const entries=Object.entries(db.cart).filter(([id,q])=>q>0);
 let total=0;
 for(const [id,q] of entries){
  const p=db.products.find(x=>x.id==id);
  if(!p||p.stock<q)return alert("Not enough stock for "+(p?p.name:"an item"));
  total+=p.price*q;
 }
 if(total<=0)return;
 entries.forEach(([id,q])=>{
  const p=db.products.find(x=>x.id==id);
  p.stock-=q;
 });
 db.donations.push({email:current().email,total:total*1.02,status:"Demo donation recorded",date:new Date().toLocaleString()});
 db.cart={};save();alert("Thank you! Your demo donation has been recorded.");render();
}

/* ADMIN */
function adminPage(){
 if(page==="Overview"){
  $("content").innerHTML=`
   <div class="grid">
    <div class="card"><p class="muted">Registered Users</p><h2>${db.users.length}</h2></div>
    <div class="card"><p class="muted">Food Items</p><h2>${db.products.length}</h2></div>
    <div class="card"><p class="muted">Vendors</p><h2>${db.vendors.length}</h2></div>
    <div class="card"><p class="muted">Food Claims</p><h2>${db.claims.length}</h2></div>
   </div>
   <div class="card"><h3>Admin Control Centre</h3><p class="muted">Manage student eligibility, food inventory, sponsorship programmes and participating vendors.</p></div>`;
 }
 if(page==="Eligibility")eligibilityPage();
 if(page==="Food Management")foodManagement();
 if(page==="Sponsorships")sponsorshipManagement();
 if(page==="Vendor Management")vendorManagement();
 if(page==="User List")userList();
}
function eligibilityPage(){
 const students=db.users.filter(u=>u.role==="Student");
 $("content").innerHTML="<h3>Student Eligibility Management</h3>"+(students.map(u=>`
 <div class="card">
  <b>${safe(u.name)}</b><p class="muted">${safe(u.email)} · ${safe(u.faculty)} · ${safe(u.college)}</p>
  <span class="tag ${u.eligibility==="Non-Eligible"?'orange':''}">${safe(u.eligibility||"Pending")}</span>
  <div class="row" style="margin-top:12px">
   <button onclick="setEligibility(${u.id},'Eligible')">Eligible</button>
   <button class="secondary" onclick="setEligibility(${u.id},'Non-Eligible')">Non-Eligible</button>
   <button class="gold" onclick="setEligibility(${u.id},'Pending')">Pending</button>
  </div>
 </div>`).join("")||"<p class='muted'>No student accounts yet.</p>");
}
function setEligibility(id,status){
 const u=db.users.find(x=>x.id===id);if(!u)return;
 u.eligibility=status;save();render();
}
function foodManagement(){
 $("content").innerHTML=`
 <div class="card">
  <h3>Add New Food Item</h3>
  <label>Food Name</label><input id="pName" placeholder="e.g. Rice (1kg)">
  <label>Category</label><select id="pCategory"><option>Dry Goods</option><option>Ready-to-Eat Meals</option></select>
  <label>Price (RM)</label><input id="pPrice" type="number" min="0" step=".01" placeholder="e.g. 4.00">
  <label>Stock Quantity</label><input id="pStock" type="number" min="0" placeholder="e.g. 50">
  <label>Upload Food Image</label><input id="pImage" type="file" accept="image/*">
  <label>Food Type</label><select id="pSponsored"><option value="false">General Assistance</option><option value="true">Sponsored Food</option></select>
  <button onclick="addProduct()">Add Food Item</button>
 </div>
 <h3>Current Food Inventory</h3>
 ${db.products.map(p=>`<div class="card row">
  <div style="flex:1">
   <b>${safe(p.name)}</b><p class="muted">${safe(p.category)} · ${money(p.price)} · Stock: ${p.stock}</p>
   <span class="tag">${p.sponsored?"Sponsored":"General"}</span>
  </div>
  <button class="secondary" onclick="editProduct(${p.id})">Edit</button>
  <button class="danger" onclick="deleteProduct(${p.id})">Delete</button>
 </div>`).join("")}`;
}
function addProduct(){
 const name=$("pName").value.trim(),price=Number($("pPrice").value),stock=Number($("pStock").value);
 if(!name||$("pPrice").value===""||$("pStock").value==="")return alert("Please fill in all food details.");
 if(price<0||stock<0)return alert("Price and stock cannot be negative.");
 const file=$("pImage").files[0];
 const create=image=>{
  db.products.push({id:uid(),name,category:$("pCategory").value,price,stock,image,sponsored:$("pSponsored").value==="true",active:true});
  save();render();alert("Food item added.");
 };
 if(file){const r=new FileReader();r.onload=()=>create(r.result);r.readAsDataURL(file);}
 else create("");
}
function editProduct(id){
 const p=db.products.find(x=>x.id===id);if(!p)return;
 const name=prompt("Food name:",p.name);if(name===null)return;
 const price=prompt("Price (RM):",p.price);if(price===null)return;
 const stock=prompt("Stock quantity:",p.stock);if(stock===null)return;
 if(!name.trim()||Number(price)<0||Number(stock)<0)return alert("Invalid details.");
 p.name=name.trim();p.price=Number(price);p.stock=Number(stock);
 save();render();
}
function deleteProduct(id){
 if(!confirm("Delete this food item?"))return;
 db.products=db.products.filter(p=>p.id!==id);save();render();
}
function sponsorshipManagement(){
 $("content").innerHTML=`
 <div class="card">
  <h3>Create Sponsorship Programme</h3>
  <label>Programme Name</label><input id="sNa
