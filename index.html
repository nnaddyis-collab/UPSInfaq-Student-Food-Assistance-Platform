<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UPSInfaq</title>

<style>
:root {
  --green: #145b43;
  --dark: #18352a;
  --light: #eaf4ee;
  --gold: #d7ad55;
  --bg: #f5f7f5;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: var(--dark);
}

header {
  background: var(--green);
  color: white;
  padding: 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

header h2 { margin: 0; }

main {
  max-width: 1100px;
  margin: auto;
  padding: 20px;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 14px;
  margin-bottom: 16px;
  border: 1px solid #e1e9e3;
}

.login {
  max-width: 450px;
  margin: 35px auto;
}

label {
  display: block;
  font-size: 13px;
  font-weight: bold;
  margin-top: 12px;
}

input, select, textarea {
  width: 100%;
  padding: 12px;
  margin-top: 6px;
  border: 1px solid #ccd8d0;
  border-radius: 8px;
  font: inherit;
}

button {
  background: var(--green);
  color: white;
  border: 0;
  padding: 11px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
}

button.secondary {
  background: #e5eee8;
  color: var(--green);
}

button.gold {
  background: var(--gold);
  color: var(--dark);
}

.hidden { display: none !important; }

.muted {
  color: #68766f;
  font-size: 13px;
  line-height: 1.6;
}

.row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 15px;
}

.tabs {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 10px 0;
}

.tabs button { white-space: nowrap; }

.tag {
  display: inline-block;
  background: var(--light);
  color: var(--green);
  padding: 5px 10px;
  border-radius: 20px;
  font-size: 12px;
}

.food-image {
  width: 100%;
  height: 150px;
  object-fit: cover;
  border-radius: 9px;
}

footer {
  text-align: center;
  padding: 25px;
  color: #849087;
  font-size: 12px;
}

@media(max-width:600px) {
  main { padding: 13px; }
  header { padding: 14px; }
}
</style>
</head>

<body>

<header>
  <div>
    <h2>UPSInfaq</h2>
    <small>Student Food Assistance Platform</small>
  </div>
  <span id="headerUser">Welcome</span>
</header>

<main>

<section id="loginPage" class="login card">
  <h1>Welcome to UPSInfaq</h1>
  <p class="muted">Sign in to access your account.</p>

  <label>Full Name</label>
  <input id="loginName" placeholder="Enter your full name">

  <label>Email Address</label>
  <input id="loginEmail" type="email" placeholder="Enter your email">

  <label>Account Role</label>
  <select id="loginRole">
    <option>Student</option>
    <option>Donor</option>
    <option>Organiser</option>
    <option>Registered Stall</option>
    <option>Admin</option>
  </select>

  <div id="studentFields">
    <label>Faculty</label>
    <select id="loginFaculty">
      <option>FPE</option>
      <option>FSM</option>
      <option>FSK</option>
    </select>

    <label>Residential College</label>
    <select id="loginCollege">
      <option>KUO</option>
      <option>KHAR</option>
      <option>KAHS</option>
      <option>KZ</option>
    </select>
  </div>

  <div id="adminField" class="hidden">
    <label>Admin Access Code</label>
    <input id="adminCode" type="password" placeholder="Admin code">
  </div>

  <button style="width:100%; margin-top:15px" onclick="login()">
    Sign In
  </button>

  <p id="loginMessage" class="muted"></p>
</section>

<section id="appPage" class="hidden">
  <div class="row">
    <div>
      <h2 id="welcomeTitle">Dashboard</h2>
      <p id="welcomeText" class="muted"></p>
    </div>
    <button class="secondary" onclick="logout()">Sign Out</button>
  </div>

  <div id="tabs" class="tabs"></div>
  <div id="content"></div>
</section>

</main>

<footer>
  UPSInfaq · Food Assistance with Care
  <br>Universiti Pendidikan Sultan Idris
</footer>

<script>
 
// DATABASE
const STORAGE_KEY = "UPSINFAQ_DATABASE";

let db = {
  users: [],
  products: [],
  vendors: [],
  sponsorships: [],
  vouchers: [],
  donations: [],
  campaigns: [],
  activities: []
};

let currentUser = null;
let currentTab = "dashboard";
let donorCart = [];

function loadDatabase() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) db = { ...db, ...JSON.parse(saved) };
  } catch (error) {
    console.error("Unable to load database:", error);
  }
}

function saveDatabase() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
  } catch (error) {
    alert("Storage is full. Please use smaller images.");
  }
}

function createId(prefix) {
  return prefix + "-" + Date.now().toString(36) +
    "-" + Math.random().toString(36).slice(2, 7).toUpperCase();
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, function(character) {
    return {
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#039;"
    }[character];
  });
}

function formatRM(amount) {
  return "RM " + Number(amount || 0).toFixed(2);
}

function logActivity(action) {
  db.activities.unshift({
    id: createId("ACT"),
    action,
    user: currentUser ? currentUser.name : "System",
    date: new Date().toLocaleString()
  });

  db.activities = db.activities.slice(0, 200);
  saveDatabase();
}

function showLoginMessage(message) {
  document.getElementById("loginMessage").textContent = message;
}

loadDatabase();

// CHANGE LOGIN FIELDS BASED ON ROLE
document.getElementById("loginRole").addEventListener("change", function() {
  const role = this.value;

  document.getElementById("studentFields").classList.toggle(
    "hidden", role !== "Student"
  );

  document.getElementById("adminField").classList.toggle(
    "hidden", role !== "Admin"
  );
});

// SIGN IN
function login() {
  const name = document.getElementById("loginName").value.trim();
  const email = document.getElementById("loginEmail").value.trim().toLowerCase();
  const role = document.getElementById("loginRole").value;

  if (!name || !email) {
    showLoginMessage("Please enter your name and email.");
    return;
  }

  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    showLoginMessage("Please enter a valid email address.");
    return;
  }

  if (role === "Student" && !email.endsWith("@siswa.com")) {
    showLoginMessage("Students must use an @siswa.com email.");
    return;
  }

  if (role === "Admin") {
    const code = document.getElementById("adminCode").value;

    if (code !== "112233") {
      showLoginMessage("Incorrect admin access code.");
      return;
    }
  }

  let user = db.users.find(item => item.email === email);

  if (user && user.role !== role) {
    showLoginMessage("This email is registered under another role.");
    return;
  }

  if (!user) {
    user = {
      id: createId("USER"),
      name,
      email,
      role,
      faculty: role === "Student"
        ? document.getElementById("loginFaculty").value : "",
      college: role === "Student"
        ? document.getElementById("loginCollege").value : "",
      eligibility: role === "Student" ? "Pending" : "Not Applicable",
      createdAt: new Date().toLocaleString(),
      active: true
    };

    db.users.push(user);
  } else {
    user.name = name;

    if (role === "Student") {
      user.faculty = document.getElementById("loginFaculty").value;
      user.college = document.getElementById("loginCollege").value;
    }
  }

  currentUser = user;
  donorCart = [];

  saveDatabase();
  logActivity("Signed in as " + role);

  document.getElementById("loginPage").classList.add("hidden");
  document.getElementById("appPage").classList.remove("hidden");
  document.getElementById("headerUser").textContent = name;

  renderDashboard();
}

// SIGN OUT
function logout() {
  if (currentUser) logActivity("Signed out");

  currentUser = null;
  donorCart = [];

  document.getElementById("appPage").classList.add("hidden");
  document.getElementById("loginPage").classList.remove("hidden");
  document.getElementById("headerUser").textContent = "Welcome";

  document.getElementById("loginName").value = "";
  document.getElementById("loginEmail").value = "";
  document.getElementById("adminCode").value = "";

  showLoginMessage("You have signed out successfully.");
}

 
// DEFAULT FOOD CATALOGUE
if (db.products.length === 0) {
  const defaultProducts = [
    ["Rice 1kg", "Dry Goods", 3.50],
    ["Instant Noodles", "Dry Goods", 1.20],
    ["Biscuits", "Dry Goods", 2.00],
    ["Cooking Oil 1kg", "Dry Goods", 3.80],
    ["Sugar 1kg", "Dry Goods", 2.90],
    ["Flour 1kg", "Dry Goods", 2.50],
    ["Canned Sardines", "Dry Goods", 4.20],
    ["Canned Tuna", "Dry Goods", 4.50],
    ["Milk Powder", "Dry Goods", 8.00],
    ["Oats", "Dry Goods", 5.50],
    ["Tea", "Dry Goods", 3.00],
    ["Coffee", "Dry Goods", 4.00],
    ["Soy Sauce", "Dry Goods", 2.80],
    ["Salt", "Dry Goods", 1.50],
    ["Peanut Butter", "Dry Goods", 5.00],
    ["Crackers", "Dry Goods", 2.50],
    ["UHT Milk", "Dry Goods", 3.00],
    ["Cereal", "Dry Goods", 6.00],
    ["Red Beans", "Dry Goods", 3.50],
    ["Cooking Sauce", "Dry Goods", 3.00],
    ["Nasi Lemak", "Ready-to-Eat", 4.00],
    ["Fried Rice", "Ready-to-Eat", 5.00],
    ["Chicken Rice", "Ready-to-Eat", 6.00],
    ["Fried Noodles", "Ready-to-Eat", 5.00],
    ["Bihun Goreng", "Ready-to-Eat", 4.50],
    ["Sandwich", "Ready-to-Eat", 4.00],
    ["Bun", "Ready-to-Eat", 2.00],
    ["Porridge", "Ready-to-Eat", 4.00],
    ["Curry Puff", "Ready-to-Eat", 2.00],
    ["Packed Meal", "Ready-to-Eat", 6.00]
  ];

  defaultProducts.forEach(item => {
    db.products.push({
      id: createId("FOOD"),
      name: item[0],
      category: item[1],
      price: item[2],
      stock: 0,
      image: "",
      access: "General",
      sponsorshipId: "",
      vendorId: "",
      active: true
    });
  });

  saveDatabase();
}

// DEFAULT VENDOR
if (db.vendors.length === 0) {
  db.vendors.push({
    id: createId("SHOP"),
    name: "UPSInfaq Food Collection Point",
    address: "Universiti Pendidikan Sultan Idris, Tanjong Malim",
    map: "https://www.google.com/maps/search/?api=1&query=Universiti+Pendidikan+Sultan+Idris",
    hours: "Monday - Friday, 8:00 AM - 5:00 PM",
    email: "",
    active: true
  });

  saveDatabase();
}

// PRODUCT HELPERS
function getProduct(productId) {
  return db.products.find(item => item.id === productId);
}

function getVendor(vendorId) {
  return db.vendors.find(item => item.id === vendorId);
}

function getProductImage(product) {
  if (product.image) {
    return escapeHTML(product.image);
  }

  return "";
}

function getProductAccessLabel(product) {
  if (product.access === "Sponsored") {
    const sponsor = db.sponsorships.find(
      item => item.id === product.sponsorshipId
    );

    return sponsor ? sponsor.name : "Sponsored Food";
  }

  return "General Assistance";
}

// SPONSORSHIP ACCESS CHECK
function studentCanClaim(product, student) {
  if (!student || student.role !== "Student") return false;
  if (!product.active || Number(product.stock) <= 0) return false;

  if (product.access === "General") {
    return student.eligibility === "Eligible";
  }

  const sponsor = db.sponsorships.find(
    item => item.id === product.sponsorshipId
  );

  if (!sponsor || !sponsor.active) return false;

  if (sponsor.accessRule === "All Students") return true;
  if (sponsor.accessRule === "Eligible Students") {
    return student.eligibility === "Eligible";
  }

  if (sponsor.accessRule === "FPE Students") {
    return student.faculty === "FPE";
  }

  if (sponsor.accessRule === "FSM Students") {
    return student.faculty === "FSM";
  }

  if (sponsor.accessRule === "FSK Students") {
    return student.faculty === "FSK";
  }

  return false;
}

saveDatabase();

// STUDENT FOOD CLAIM
function claimFood(productId) {
  if (!currentUser || currentUser.role !== "Student") return;

  const product = getProduct(productId);

  if (!product || !studentCanClaim(product, currentUser)) {
    alert("You are not eligible to claim this food.");
    return;
  }

  const dailyLimit = 2;
  const today = new Date().toDateString();

  const todaysClaims = db.vouchers.filter(voucher =>
    voucher.studentId === currentUser.id &&
    new Date(voucher.createdAt).toDateString() === today
  );

  if (todaysClaims.length >= dailyLimit) {
    alert("You have reached your daily claim limit.");
    return;
  }

  const vendor = getVendor(product.vendorId);

  if (!vendor || !vendor.active) {
    alert("No active collection point is available.");
    return;
  }

  const voucher = {
    id: createId("VOUCHER"),
    code: "UPI-" + Math.random().toString(36).slice(2, 8).toUpperCase(),
    studentId: currentUser.id,
    studentName: currentUser.name,
    productId: product.id,
    productName: product.name,
    vendorId: vendor.id,
    status: "Pending",
    createdAt: new Date().toISOString(),
    redeemedAt: ""
  };

  db.vouchers.push(voucher);
  saveDatabase();
  logActivity("Food voucher created: " + voucher.code);

  alert("Your voucher has been created: " + voucher.code);
  renderDashboard();
}

// STALL VOUCHER REDEMPTION
function redeemVoucher(voucherCode) {
  if (!currentUser || currentUser.role !== "Registered Stall") return;

  const voucher = db.vouchers.find(item =>
    item.code.toUpperCase() === voucherCode.trim().toUpperCase()
  );

  if (!voucher) {
    alert("Voucher not found.");
    return;
  }

  if (voucher.status !== "Pending") {
    alert("This voucher has already been redeemed or cancelled.");
    return;
  }

  const vendor = db.vendors.find(item =>
    item.id === voucher.vendorId &&
    item.email.toLowerCase() === currentUser.email.toLowerCase()
  );

  if (!vendor) {
    alert("This voucher does not belong to your registered stall.");
    return;
  }

  const product = getProduct(voucher.productId);

  if (!product || product.stock <= 0) {
    alert("Food stock is unavailable.");
    return;
  }

  product.stock -= 1;
  voucher.status = "Redeemed";
  voucher.redeemedAt = new Date().toISOString();

  saveDatabase();
  logActivity("Voucher redeemed: " + voucher.code);

  alert("Voucher successfully redeemed.");
  renderDashboard();
}

// CANCEL AN UNREDEEMED VOUCHER
function cancelVoucher(voucherId) {
  if (!currentUser || currentUser.role !== "Student") return;

  const voucher = db.vouchers.find(item =>
    item.id === voucherId &&
    item.studentId === currentUser.id
  );

  if (!voucher || voucher.status !== "Pending") {
    alert("This voucher cannot be cancelled.");
    return;
  }

  voucher.status = "Cancelled";
  saveDatabase();

  logActivity("Voucher cancelled: " + voucher.code);
  renderDashboard();
}

// STUDENT ELIGIBILITY LABEL
function eligibilityLabel(student) {
  if (student.eligibility === "Eligible") {
    return "Eligible";
  }

  if (student.eligibility === "Non-Eligible") {
    return "Non-Eligible";
  }

  return "Pending Verification";
}

// DONOR SHOPPING CART
function addToCart(productId) {
  const product = getProduct(productId);

  if (!currentUser || currentUser.role !== "Donor") return;
  if (!product || !product.active) return;

  const existing = donorCart.find(item => item.productId === productId);

  if (existing) {
    existing.quantity += 1;
  } else {
    donorCart.push({
      productId,
      quantity: 1
    });
  }

  renderDashboard();
}

function changeCartQuantity(productId, change) {
  const item = donorCart.find(item => item.productId === productId);
  if (!item) return;

  item.quantity += change;

  if (item.quantity <= 0) {
    donorCart = donorCart.filter(item => item.productId !== productId);
  }

  renderDashboard();
}

function getCartTotal() {
  return donorCart.reduce((total, item) => {
    const product = getProduct(item.productId);
    return total + (product ? product.price * item.quantity : 0);
  }, 0);
}

// DEMO DONATION CHECKOUT
function checkoutDonation() {
  if (!currentUser || currentUser.role !== "Donor") return;
  if (donorCart.length === 0) {
    alert("Your cart is empty.");
    return;
  }

  const itemsTotal = getCartTotal();
  const serviceCharge = itemsTotal * 0.02;
  const tipInput = document.getElementById("donorTip");
  const tip = Math.max(0, Number(tipInput ? tipInput.value : 0));
  const grandTotal = itemsTotal + serviceCharge + tip;

  const confirmed = confirm(
    "Donation summary\n\nItems: " + formatRM(itemsTotal) +
    "\nService charge (2%): " + formatRM(serviceCharge) +
    "\nOptional tip: " + formatRM(tip) +
    "\n\nTotal: " + formatRM(grandTotal) +
    "\n\nContinue with demo checkout?"
  );

  if (!confirmed) return;

  const donation = {
    id: createId("DON"),
    donorId: currentUser.id,
    donorName: currentUser.name,
    items: donorCart.map(item => {
      const product = getProduct(item.productId);
      return {
        productId: item.productId,
        name: product.name,
        quantity: item.quantity,
        unitPrice: product.price
      };
    }),
    itemsTotal,
    serviceCharge,
    tip,
    total: grandTotal,
    date: new Date().toISOString(),
    status: "Demo Completed"
  };

  donation.items.forEach(item => {
    const product = getProduct(item.productId);
    if (product) product.stock += item.quantity;
  });

  db.donations.push(donation);
  donorCart = [];

  saveDatabase();
  logActivity("Demo donation completed: " + donation.id);

  alert("Thank you! Your demo donation has been recorded.");
  renderDashboard();
}

// DONOR SPONSORSHIP
function sponsorStudent(studentId, amount) {
  if (!currentUser || currentUser.role !== "Donor") return;

  const student = db.users.find(user =>
    user.id === studentId && user.role === "Student"
  );

  if (!student) {
    alert("Student account not found.");
    return;
  }

  const value = Number(amount);

  if (!Number.isFinite(value) || value <= 0) {
    alert("Please enter a valid sponsorship amount.");
    return;
  }

  db.donations.push({
    id: createId("SPONSOR"),
    donorId: currentUser.id,
    donorName: currentUser.name,
    studentId: student.id,
    studentName: student.name,
    total: value,
    date: new Date().toISOString(),
    status: "Demo Sponsorship"
  });

  saveDatabase();
  logActivity("Student sponsorship recorded.");
  alert("Demo sponsorship recorded successfully.");
  renderDashboard();
}

// ADMIN: UPDATE STUDENT ELIGIBILITY
function updateEligibility(studentId, status) {
  if (!currentUser || currentUser.role !== "Admin") return;

  const student = db.users.find(user =>
    user.id === studentId && user.role === "Student"
  );

  if (!student) return;

  student.eligibility = status;
  saveDatabase();
  logActivity("Updated eligibility for " + student.name);
  renderDashboard();
}

// ADMIN: ADD FOOD PRODUCT
function addProduct() {
  if (!currentUser || currentUser.role !== "Admin") return;

  const name = document.getElementById("newFoodName").value.trim();
  const category = document.getElementById("newFoodCategory").value;
  const price = Number(document.getElementById("newFoodPrice").value);
  const stock = Number(document.getElementById("newFoodStock").value);
  const access = document.getElementById("newFoodAccess").value;
  const vendorId = document.getElementById("newFoodVendor").value;

  if (!name || !Number.isFinite(price) || price < 0 ||
      !Number.isInteger(stock) || stock < 0) {
    alert("Please enter valid product details.");
    return;
  }

  db.products.push({
    id: createId("FOOD"),
    name,
    category,
    price,
    stock,
    image: "",
    access,
    sponsorshipId: "",
    vendorId,
    active: true
  });

  saveDatabase();
  logActivity("Added food product: " + name);
  alert("Food product added.");
  renderDashboard();
}

// ADMIN: UPLOAD A SMALL PRODUCT IMAGE
function uploadFoodImage(productId, fileInput) {
  if (!currentUser || currentUser.role !== "Admin") return;

  const file = fileInput.files[0];
  if (!file) return;

  if (!file.type.startsWith("image/")) {
    alert("Please select an image file.");
    return;
  }

  if (file.size > 500000) {
    alert("Please use an image smaller than 500KB.");
    return;
  }

  const reader = new FileReader();

  reader.onload = function(event) {
    const product = getProduct(productId);
    if (!product) return;

    product.image = event.target.result;
    saveDatabase();
    logActivity("Updated image for " + product.name);
    renderDashboard();
  };

  reader.readAsDataURL(file);
}

// ADMIN: UPDATE PRODUCT STOCK
function updateProductStock(productId, amount) {
  if (!currentUser || currentUser.role !== "Admin") return;

  const product = getProduct(productId);
  const newStock = Number(amount);

  if (!product || !Number.isInteger(newStock) || newStock < 0) {
    alert("Please enter a valid stock quantity.");
    return;
  }

  product.stock = newStock;
  saveDatabase();
  logActivity("Updated stock for " + product.name);
  renderDashboard();
}

// ADMIN: DELETE PRODUCT
function deleteProduct(productId) {
  if (!currentUser || currentUser.role !== "Admin") return;

  const product = getProduct(productId);
  if (!product) return;

  if (!confirm("Delete " + product.name + "?")) return;

  db.products = db.products.filter(item => item.id !== productId);
  saveDatabase();
  logActivity("Deleted food product: " + product.name);
  renderDashboard();
}

// ADMIN: CREATE SPONSORSHIP
function addSponsorship() {
  if (!currentUser || currentUser.role !== "Admin") return;

  const name = document.getElementById("sponsorName").value.trim();
  const accessRule = document.getElementById("sponsorAccess").value;
  const description = document.getElementById("sponsorDescription").value.trim();

  if (!name) {
    alert("Please enter a sponsorship name.");
    return;
  }

  db.sponsorships.push({
    id: createId("SP"),
    name,
    accessRule,
    description,
    active: true,
    createdAt: new Date().toISOString()
  });

  saveDatabase();
  logActivity("Created sponsorship: " + name);
  alert("Sponsorship created.");
  renderDashboard();
}

// ADMIN: ADD REGISTERED STALL
function addVendor() {
  if (!currentUser || currentUser.role !== "Admin") return;

  const name = document.getElementById("vendorName").value.trim();
  const email = document.getElementById("vendorEmail").value.trim().toLowerCase();
  const address = document.getElementById("vendorAddress").value.trim();
  const map = document.getElementById("vendorMap").value.trim();
  const hours = document.getElementById("vendorHours").value.trim();

  if (!name || !email || !address) {
    alert("Please enter the stall name, email and address.");
    return;
  }

  db.vendors.push({
    id: createId("SHOP"),
    name,
    email,
    address,
    map,
    hours,
    active: true
  });

  saveDatabase();
  logActivity("Added registered stall: " + name);
  alert("Registered stall added.");
  renderDashboard();
}

// DASHBOARD NAVIGATION
function setTab(tabName) {
  currentTab = tabName;
  renderDashboard();
}

function renderDashboard() {
  if (!currentUser) return;

  const role = currentUser.role;
  const tabs = document.getElementById("tabs");

  document.getElementById("welcomeTitle").textContent =
    role + " Dashboard";

  document.getElementById("welcomeText").textContent =
    "Welcome, " + currentUser.name;

  let availableTabs = [];

  if (role === "Student") {
    availableTabs = [
      ["dashboard", "Home"],
      ["food", "Food Catalogue"],
      ["vouchers", "My Vouchers"],
      ["history", "My History"]
    ];
  } else if (role === "Donor") {
    availableTabs = [
      ["dashboard", "Home"],
      ["food", "Donation Catalogue"],
      ["cart", "My Cart"],
      ["donations", "My Donations"],
      ["leaderboard", "Top Donors"]
    ];
  } else if (role === "Admin") {
    availableTabs = [
      ["dashboard", "Overview"],
      ["users", "Students"],
      ["food", "Food Inventory"],
      ["sponsorships", "Sponsorships"],
      ["vendors", "Registered Stalls"],
      ["vouchers", "Vouchers"],
      ["reports", "Reports"]
    ];
  } else if (role === "Organiser") {
    availableTabs = [
      ["dashboard", "Home"],
      ["campaigns", "Campaigns"],
      ["reports", "Reports"]
    ];
  } else if (role === "Registered Stall") {
    availableTabs = [
      ["dashboard", "Stall Home"],
      ["vouchers", "Redeem Voucher"],
      ["reports", "Daily Report"]
    ];
  }

  if (!availableTabs.some(item => item[0] === currentTab)) {
    currentTab = "dashboard";
  }

  tabs.innerHTML = availableTabs.map(item =>
    `<button class="${currentTab === item[0] ? "active" : ""}"
      onclick="setTab('${item[0]}')">${item[1]}</button>`
  ).join("");

  const content = document.getElementById("content");

  if (role === "Student") renderStudent(content);
  else if (role === "Donor") renderDonor(content);
  else if (role === "Admin") renderAdmin(content);
  else if (role === "Organiser") renderOrganiser(content);
  else if (role === "Registered Stall") renderStall(content);
}

// STUDENT DASHBOARD
function renderStudent(content) {
  if (currentTab === "dashboard") {
    content.innerHTML = `
      <div class="card">
        <h3>Student Assistance</h3>
        <p>Your eligibility status:
          <span class="tag">${escapeHTML(eligibilityLabel(currentUser))}</span>
        </p>
        <p class="muted">General assistance is available to eligible students.
        Sponsored food may have different access conditions.</p>
        <button onclick="setTab('food')">Browse Food</button>
      </div>`;
  }

  if (currentTab === "food") {
    const products = db.products.filter(product =>
      product.active &&
      studentCanClaim(product, currentUser)
    );

    content.innerHTML = `
      <h3>Available Food</h3>
      <div class="grid">
        ${products.map(product => {
          const vendor = getVendor(product.vendorId);
          return `
            <div class="card">
              ${product.image
                ? `<img class="food-image" src="${product.image}" alt="${escapeHTML(product.name)}">`
                : `<div class="food-image"></div>`}
              <h3>${escapeHTML(product.name)}</h3>
              <span class="tag">${escapeHTML(getProductAccessLabel(product))}</span>
              <p>Available stock: ${product.stock}</p>
              <p class="muted">${vendor ? escapeHTML(vendor.name) : "Collection point not assigned"}</p>
              ${vendor && vendor.map
                ? `<a href="${escapeHTML(vendor.map)}" target="_blank" rel="noopener">View location</a>`
                : ""}
              <br><br>
              <button onclick="claimFood('${product.id}')">Claim Food</button>
            </div>`;
        }).join("") || `<p class="muted">No food is currently available for your account.</p>`}
      </div>`;
  }

  if (currentTab === "vouchers" || currentTab === "history") {
    const vouchers = db.vouchers.filter(item =>
      item.studentId === currentUser.id
    );

    content.innerHTML = `
      <h3>My Food Vouchers</h3>
      ${vouchers.map(item => `
        <div class="card">
          <h3>${escapeHTML(item.productName)}</h3>
          <p>Voucher: <strong>${escapeHTML(item.code)}</strong></p>
          <p>Status: <span class="tag">${escapeHTML(item.status)}</span></p>
          <p class="muted">${new Date(item.createdAt).toLocaleString()}</p>
          ${item.status === "Pending"
            ? `<button class="secondary" onclick="cancelVoucher('${item.id}')">Cancel Voucher</button>`
            : ""}
        </div>
      `).join("") || `<p class="muted">No vouchers yet.</p>`}`;
  }
}

// DONOR DASHBOARD
function renderDonor(content) {
  if (currentTab === "dashboard") {
    content.innerHTML = `
      <div class="card">
        <h3>Make a Difference</h3>
        <p class="muted">Your contribution helps provide food assistance to UPSI students.</p>
        <button onclick="setTab('food')">Start Donating</button>
      </div>`;
  }

  if (currentTab === "food") {
    content.innerHTML = `
      <h3>Donation Catalogue</h3>
      <p class="muted">Choose dry goods or ready-to-eat meals for the food assistance stock.</p>
      <div class="grid">
        ${db.products.filter(item => item.active).map(product => `
          <div class="card">
            ${product.image
              ? `<img class="food-image" src="${product.image}" alt="${escapeHTML(product.name)}">`
              : `<div class="food-image"></div>`}
            <h3>${escapeHTML(product.name)}</h3>
            <p>${escapeHTML(product.category)}</p>
            <p class="price">${formatRM(product.price)}</p>
            <button onclick="addToCart('${product.id}')">Add to Cart</button>
          </div>
        `).join("")}
      </div>`;
  }

  if (currentTab === "cart") {
    content.innerHTML = `
      <h3>My Donation Cart</h3>
      ${donorCart.map(item => {
        const product = getProduct(item.productId);
        if (!product) return "";
        return `
          <div class="card row">
            <div>
              <strong>${escapeHTML(product.name)}</strong>
              <p>${formatRM(product.price)} × ${item.quantity}</p>
            </div>
            <div>
              <button class="secondary" onclick="changeCartQuantity('${product.id}',-1)">−</button>
              ${item.quantity}
              <button class="secondary" onclick="changeCartQuantity('${product.id}',1)">+</button>
            </div>
          </div>`;
      }).join("") || `<p class="muted">Your cart is empty.</p>`}

      <div class="card">
        <p>Items total: <strong>${formatRM(getCartTotal())}</strong></p>
        <p>Service charge: 2%</p>
        <label>Optional tip (RM)</label>
        <input id="donorTip" type="number" min="0" step="0.50" value="0">
        <button class="gold" onclick="checkoutDonation()">Confirm Demo Donation</button>
        <p class="muted">Demo checkout only. No real payment is collected.</p>
      </div>`;
  }

  if (currentTab === "donations") {
    const donations = db.donations.filter(item =>
      item.donorId === currentUser.id
    );

    content.innerHTML = `
      <h3>Donation History</h3>
      ${donations.map(item => `
        <div class="card">
          <strong>${escapeHTML(item.id)}</strong>
          <p>${formatRM(item.total)}</p>
          <p class="muted">${new Date(item.date).toLocaleString()}</p>
          <span class="tag">${escapeHTML(item.status)}</span>
        </div>
      `).join("") || `<p class="muted">No donations recorded yet.</p>`}`;
  }

  if (currentTab === "leaderboard") {
    const totals = {};

    db.donations.forEach(item => {
      totals[item.donorId] = (totals[item.donorId] || 0) + Number(item.total || 0);
    });

    const leaders = Object.entries(totals)
      .map(([id, total]) => ({
        user: db.users.find(user => user.id === id),
        total
      }))
      .filter(item => item.user)
      .sort((a, b) => b.total - a.total)
      .slice(0, 10);

    content.innerHTML = `
      <h3>Top 10 Donors</h3>
      ${leaders.map((item, index) => `
        <div class="card row">
          <strong>#${index + 1} ${escapeHTML(item.user.name)}</strong>
          <strong>${formatRM(item.total)}</strong>
        </div>
      `).join("") || `<p class="muted">No donor records yet.</p>`}`;
  }
}

// ORGANISER DASHBOARD
function renderOrganiser(content) {
  if (currentTab === "dashboard") {
    content.innerHTML = `
      <div class="card">
        <h3>Organiser Portal</h3>
        <p class="muted">Manage food assistance campaigns and community activities.</p>
        <button onclick="setTab('campaigns')">Manage Campaigns</button>

  if (currentTab === "campaigns") {
    content.innerHTML = `
      <h3>Create Campaign</h3>
      <div class="card">
        <label>Campaign Name</label>
        <input id="campaignName" placeholder="Campaign name">
        <label>Description</label>
        <textarea id="campaignDescription"></textarea>
        <label>Event Date</label>
        <input id="campaignDate" type="date">
        <label>Location</label>
        <input id="campaignLocation" placeholder="Event location">
        <button onclick="addCampaign()">Create Campaign</button>
      </div>
      ${db.campaigns.map(item => `
        <div class="card">

        </div>
      `).join("")}`;

  if (currentTab === "reports") {

        <p>Total campaigns: ${db.campaigns.length}</p>
      </div>`;
  }
}

function addCampaign() {
  if (!currentUser || currentUser.role !== "Organiser") return;

  const name = document.getElementById("campaignName").value.trim();
  const description = document.getElementById("campaignDescription").value.trim();
  const date = document.getElementById("campaignDate").value;
  const location = document.getElementById("campaignLocation").value.trim();

  if (!name || !date || !location) {
    alert("Please enter the campaign name, date and location.");
    return;
  }

  db.campaigns.push({
    id: createId("CAMP"),
    name,
    description,
    date,
    location,
    organiserId: currentUser.id
  });

  saveDatabase();
  logActivity("Created campaign: " + name);
  alert("Campaign created.");
  renderDashboard();
}

function renderStall(content) {
  const vendor = db.vendors.find(item =>

  if (currentTab === "dashboard") {
    content.innerHTML = `
      <div class="card">
        <h3>Registered Stall Portal</h3>
        ${vendor ? `
          <p><strong>${escapeHTML(vendor.name)}</strong></p>
          <p>${escapeHTML(vendor.address)}</p>

        <p>Subscription: RM50/month after the first 2 free months.</p>
        <p class="muted">Subscription information only. No payment is collected here.</p>
      </div>`;

  if (currentTab === "vouchers") {
    content.innerHTML = `
      <div class="card">
        <h3>Redeem Student Voucher</h3>
